<script>
song = null;

function vissang() {
    x = Math.floor(Math.random() * data.length); // Ensure the index is within bounds
    console.log(x);
    var song = data[x].SONG + "," + " " + data[x].NAME; // Replace 'song' with the actual column name in your CSV
    document.getElementById('songs').innerHTML = song;
}

window.onload = function() {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "data.csv", true);
  xhr.responseType = "text";
  xhr.onload = function() {
    data = Papa.parse(xhr.responseText, {
      header: true // set this to true if the first row contains the header names
    }).data;
  };
  xhr.send();
}
</script>
