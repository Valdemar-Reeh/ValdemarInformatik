    <!-- Add inside <body> (after the grid) -->
    <div class="lightbox" id="lightbox">
      <img id="lightbox-img" src="" alt="Fullscreen" />
    </div>    
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightbox-img");
        const images = document.querySelectorAll(".grid img");

        // Add click event to each image
        images.forEach((img) => {
          img.addEventListener("click", () => {
            console.log("Image clicked:", img.src); // Log the clicked image source 
            lightbox.style.display = "flex"; // Show the lightbox
            lightboxImg.src = img.src; // Set the clicked image as the lightbox image
          });
        });

        // Hide the lightbox when clicked
        lightbox.addEventListener("click", () => {
          lightbox.style.display = "none"; // Hide the lightbox
        });
      });
    </script>
